name: AECO v2.4 egg annotation image acquisition
on:
  pull_request:
    branches: [analysis/foam-visual-v2.3]
    paths:
      - 'scripts/foam_egg_images_v2_4.py'
      - '.github/workflows/foam_egg_images_v2_4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/foam_egg_images_v2_4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v24-egg-candidates
          path: results/v2.4_candidates/
          if-no-files-found: error
