name: AECO v1.5 stratified global butterfly grid
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/global_butterfly_grid_v1_5.py'
      - '.github/workflows/global_butterfly_grid_v1_5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scale: [100, 200]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl pandas numpy pyreadr pyproj xarray netCDF4 statsmodels scikit-learn
      - run: python scripts/global_butterfly_grid_v1_5.py --scale ${{ matrix.scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeco-butterfly-pilot-${{ matrix.scale }}km
          path: results/v1.5/${{ matrix.scale }}/
          if-no-files-found: warn
