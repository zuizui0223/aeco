name: AECO v1.8 frozen pooled-month replication
on:
  pull_request:
    branches: [analysis/foam-coverage-v1.7]
    paths:
      - 'scripts/foam_replication_v1_8.py'
      - 'data/frozen/foam_pooled_month_v1.8.json'
      - '.github/workflows/foam_replication_v1_8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyproj
      - run: python scripts/foam_replication_v1_8.py test
      - run: python scripts/foam_replication_v1_8.py collect --shard ${{ matrix.shard }} --nshards 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18-shard-${{ matrix.shard }}
          path: results/v1.8/shard_*.jsonl
          if-no-files-found: error
  analyze:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyproj
      - uses: actions/download-artifact@v4
        with:
          pattern: v18-shard-*
          merge-multiple: true
          path: results/v1.8
      - run: python scripts/foam_replication_v1_8.py analyze
      - uses: actions/upload-artifact@v4
        with:
          name: v18-results
          path: results/v1.8/
          if-no-files-found: error
