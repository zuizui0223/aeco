name: AECO v2.5 cross-structure licensed image acquisition
on:
  pull_request:
    branches: [analysis/foam-optics-v2.4]
    paths:
      - 'scripts/foam_cross_structure_v2_5.py'
      - '.github/workflows/foam_cross_structure_v2_5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/foam_cross_structure_v2_5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v25-cross-structure-candidates
          path: results/v2.5_candidates/
          if-no-files-found: error
